name: Build and publish

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extensions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is not set"
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > signingkey.jks

      - name: Lint and build release APKs
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS=()
          for module in :core :lib:textinterceptor; do
            TASKS+=("${module}:spotlessCheck" "${module}:lintRelease")
          done
          for build_file in src/*/*/build.gradle.kts; do
            module=":$(dirname "$build_file" | tr / :)"
            TASKS+=("${module}:spotlessCheck" "${module}:lintRelease" "${module}:assembleRelease")
          done
          ./gradlew "${TASKS[@]}"

      - name: Clean up signing key
        if: always()
        run: rm -f signingkey.jks

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extensions
          path: |
            src/*/*/build/outputs/apk/release/*.apk
            src/*/*/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish extension repo
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          persist-credentials: false

      - name: Download APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extensions
          path: artifacts

      - name: Generate repo
        run: python3 main/.github/scripts/generate-repo.py artifacts repo

      - name: Push to repo branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd repo
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Orphan branch, one commit: old APKs don't pile up in the history.
          git commit -q -m "Update extensions repo" -m "From ${GITHUB_REPOSITORY}@${SOURCE_SHA}"
          if git -c "http.extraheader=$auth" fetch -q --depth 1 "$remote" repo 2>/dev/null &&
            [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "No changes to publish"
            exit 0
          fi
          git -c "http.extraheader=$auth" push --force "$remote" HEAD:refs/heads/repo
          cat repo.json
